title: Extended LinkedIn Content | Awar
description: In-depth technical content extending my LinkedIn posts
url: "https://NotAwar.github.io"
baseurl: ""
github_username: NotAwar
linkedin_username: notawar
author: Awar

# Build settings
markdown: kramdown
theme: minima
# Add remote_theme for GitHub Pages compatibility
remote_theme: jekyll/minima
future: false

plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-remote-theme # Add this plugin for remote themes

# Exclude files from processing
exclude:
- .sass-cache/
- .jekyll-cache/
- gemfiles/
- Gemfile
- Gemfile.lock
- node_modules/
- vendor/
- .github/
- README.md
- scripts/

# Collections
collections:
  linkedin_extended:
    output: true
    permalink: /linkedin-extended/:slug/

# Defaults
defaults:
- scope:
    path: ""
    type: "pages"
  values:
    layout: "page"
- scope:
    path: ""
    type: "linkedin_extended"
  values:
    layout: "linkedin_extended"
    author: "Awar"

# LinkedIn settings
linkedin:
  username: notawar
  profile_url: "https://www.linkedin.com/in/notawar/"
