title: "Awar Abdulkarim | Cloud Engineer"
description: "Senior Cloud Engineer and Cloud Native Competency Lead"
url: "https://NotAwar.github.io"
baseurl: ""
github_username: NotAwar
linkedin_username: notawar
author: Awar

# Build settings
markdown: kramdown
theme: minima
remote_theme: jekyll/minima

# Enable GitHub Pages plugins
plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-remote-theme
- jekyll-github-metadata # Added to pull GitHub info

# Exclude files from processing
exclude:
- .sass-cache/
- .jekyll-cache/
- gemfiles/
- Gemfile
- Gemfile.lock
- node_modules/
- vendor/
- .github/
- README.md
- scripts/

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:slug/
  posts:
    output: true
    permalink: /blog/:slug/

# Defaults
defaults:
- scope:
    path: ""
    type: "pages"
  values:
    layout: "page"
- scope:
    path: ""
    type: "projects"
  values:
    layout: "project"
    author: "Awar"
- scope:
    path: ""
    type: "posts"
  values:
    layout: "post"
    author: "Awar"

# GitHub settings
github:
  username: NotAwar
  repository: NotAwar.github.io
