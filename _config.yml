title: Extended LinkedIn Content | Awar
description: In-depth technical content extending my LinkedIn posts
url: "https://NotAwar.github.io"
baseurl: ""
github_username: NotAwar
linkedin_username: notawar
author: Awar

# Build settings
markdown: kramdown
remote_theme: jekyll/minima
theme: minima # Keep for local development

plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-remote-theme

# Exclude files from processing
exclude:
- .sass-cache/
- .jekyll-cache/
- gemfiles/
- Gemfile
- Gemfile.lock
- node_modules/
- vendor/bundle/
- vendor/cache/
- vendor/gems/
- vendor/ruby/
- .github/
- README.md

# Date format
date_format: "%d/%m/%Y"

# Collections - exclusively LinkedIn extended content
collections:
  linkedin_extended:
    output: true
    permalink: /linkedin-extended/:slug/

# Defaults
defaults:
- scope:
    path: ""
    type: "pages"
  values:
    layout: "page"
- scope:
    path: ""
    type: "linkedin_extended"
  values:
    layout: "linkedin_extended"
    author: "Awar"

# LinkedIn integration settings
linkedin:
  username: notawar
  profile_url: "https://www.linkedin.com/in/notawar/"
