title: "Awar Abdulkarim"
description: "Cloud engineer sharing cool tech discoveries and building stuff with Kubernetes & Azure."
url: "https://NotAwar.github.io"
baseurl: ""
github_username: NotAwar
linkedin_username: notawar
author: Awar Abdulkarim

# Build settings
markdown: kramdown
theme: minima
remote_theme: jekyll/minima

# Enable GitHub Pages plugins
plugins:
- jekyll-feed
- jekyll-seo-tag
- jekyll-sitemap
- jekyll-remote-theme
- jekyll-github-metadata

# Exclude files from processing
exclude:
- .sass-cache/
- .jekyll-cache/
- gemfiles/
- Gemfile
- Gemfile.lock
- node_modules/
- vendor/
- .github/
- README.md
- SETUP.md
- scripts/

# Collections - remove unused collections
collections:
  projects:
    output: true
    permalink: /projects/:slug/

# Defaults
defaults:
- scope:
    path: ""
    type: "pages"
  values:
    layout: "page"
- scope:
    path: ""
    type: "projects"
  values:
    layout: "project"
    author: "Awar"

# GitHub settings
github:
  username: NotAwar
  repository: NotAwar.github.io

# Social links (used by the site)
linkedin:
  profile_url: "https://www.linkedin.com/in/notawar"
