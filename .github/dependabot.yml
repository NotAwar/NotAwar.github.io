version: 2
updates:
# Keep npm dependencies (Astro, React, axios, etc.) up to date
- package-ecosystem: "npm"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    astro:
      patterns:
      - "astro"
      - "@astrojs/*"
    react:
      patterns:
      - "react"
      - "react-dom"
      - "@types/react*"
  commit-message:
    prefix: "chore(deps)"
  labels:
  - "dependencies"
  open-pull-requests-limit: 10

# Keep GitHub Actions workflows up to date
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  commit-message:
    prefix: "chore(ci)"
  labels:
  - "dependencies"
  - "github-actions"
  open-pull-requests-limit: 10
