name: Build and Deploy Astro Site with LinkedIn Sync

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch LinkedIn Profile and Update CV Data
        env:
          LINKEDIN_PROFILE_URL: ${{ secrets.LINKEDIN_PROFILE_URL || 'https://www.linkedin.com/in/notawar' }}
          PROXYCURL_API_KEY: ${{ secrets.PROXYCURL_API_KEY }}
        run: npm run sync-linkedin

      - name: Fetch latest posts from Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
        run: npm run sync-buffer

      - name: Commit updated profile data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/generated-profile.json
          git diff --staged --quiet || git commit -m "Auto-sync: Update profile from LinkedIn and Buffer [skip ci]"
          if ! git push; then
            echo "⚠️ Warning: Failed to push updates"
            exit 0
          fi

      - name: Build Astro site
        run: npm run build
        continue-on-error: false

      - name: Add CNAME
        run: cp CNAME dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

