name: Deploy Jekyll site to Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.225.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      
      - name: Create .nojekyll file
        run: touch .nojekyll
        
      - name: Verify Theme Files
        run: |
          echo "Available themes:"
          bundle show --paths | grep theme
          
          echo "Checking theme directories:"
          GEM_PATH=$(bundle info --path minima)
          echo "Theme path: $GEM_PATH"
          ls -la $GEM_PATH/_layouts || echo "No layouts directory found"
          ls -la $GEM_PATH/_includes || echo "No includes directory found"
      
      - name: Install dependencies and build
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          bundle exec jekyll build
      
      - name: Debug Site Output
        run: |
          echo "Site files generated:"
          ls -la _site
          echo "-------------------"
          echo "Site structure:"
          find _site -type f | sort
      
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site # The folder the action should deploy
          branch: gh-pages # The branch the action should deploy to
          clean: true # Automatically remove deleted files
          single-commit: true
          
      - name: Clear GitHub Pages cache
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds