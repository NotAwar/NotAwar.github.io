name: Deploy Jekyll site to Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.225.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      
      - name: Build Site
        uses: actions/jekyll-build-pages@v1.0.13
      
      - name: Validate Site Content
        run: |
          echo "Checking for symlinks and hard links..."
          find _site -type l -exec ls -la {} \; || echo "No symlinks found"
          
          echo "Checking total size..."
          du -sh _site
          
          # Remove any potential problematic files
          find _site -type l -delete
          
          # Ensure permissions are set correctly
          chmod -R 755 _site
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
        with:
          artifact_name: github-pages