<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(145deg, #0D0D0D 0%, #1A1A1A 50%, #0D0D0D 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        .container {
            display: flex;
            align-items: center;
            gap: 60px;
            z-index: 1;
            padding: 80px;
        }
        .logo {
            width: 280px;
            height: 280px;
            flex-shrink: 0;
        }
        .content {
            flex: 1;
        }
        h1 {
            font-size: 96px;
            font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #DAA520);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            line-height: 1.1;
        }
        .subtitle {
            font-size: 42px;
            color: #FFFFFF;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .description {
            font-size: 28px;
            color: #E0E0E0;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .footer {
            font-size: 32px;
            color: #FFD700;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.png" alt="Logo" class="logo">
        <div class="content">
            <h1>Awar Abdulkarim</h1>
            <div class="subtitle">Cloud Engineer & Tech Enthusiast</div>
            <div class="description">Building innovative solutions with Kubernetes & Azure</div>
            <div class="footer">awar.no</div>
        </div>
    </div>
</body>
</html>
